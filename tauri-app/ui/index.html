<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Answer</title>
  <link rel="stylesheet" href="answer.css" />
  <script src="vendor/marked.umd.js"></script>
</head>
<body>
  <div id="card">
    <header id="bar" data-tauri-drag-region>
      <span id="dot" class="dot idle"></span>
      <span id="status" data-tauri-drag-region>Ready</span>
      <span id="clickBadge" class="badge" hidden title="Clicks pass through this window. Use the click-through hotkey or the tray menu to turn it off.">click-through</span>
      <select id="provider" title="AI provider">
        <option value="grok">Grok CLI</option>
        <option value="codex">Codex CLI</option>
        <option value="gemini">Gemini API</option>
      </select>
      <button id="ask" title="Analyze screen">&#8635;</button>
      <button id="reset" title="New conversation">&#10227;</button>
      <button id="stealthBtn" title="Stealth">&#128065;</button>
      <button id="gear" title="Settings">&#9881;</button>
      <button id="hide" title="Hide (Esc)">&#8211;</button>
    </header>
    <div id="stealthWarn" hidden>
      Stealth OFF: screen share, recording and remote desktop can see this window.
    </div>

    <main id="answer"></main>
    <footer id="meta"></footer>
  </div>
  <script src="answer.js"></script>
</body>
</html>
